name: Build EXE

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Setup UPX
      uses: crazy-max/ghaction-upx@v3
      with:
        version: latest
        install-only: true

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt --no-cache-dir

    - name: Build EXE with PyInstaller
      # Baris perintah menggunakan file spec untuk memastikan hiddenimports (requests, pyttsx3) ter-bundle.
      run: pyinstaller --clean --noconfirm StreamChatOverlay.spec

    - name: Zip output folder
      run: |
        Compress-Archive -Path dist\StreamChatOverlay -DestinationPath dist\StreamChatOverlay-windows.zip

    - name: Upload Release Asset
      uses: softprops/action-gh-release@v2
      with:
        files: dist/StreamChatOverlay-windows.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
