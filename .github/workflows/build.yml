name: Build EXE

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
      - '*'
  release:
    types: [published, created, edited, prereleased]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Setup UPX
      uses: crazy-max/ghaction-upx@v3
      with:
        version: latest
        install-only: true

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt --no-cache-dir

    - name: Build EXE with PyInstaller
      run: pyinstaller --clean --noconfirm StreamChatOverlay.spec

    - name: Zip output folder
      run: |
        Compress-Archive -Path dist\StreamChatOverlay -DestinationPath dist\StreamChatOverlay-windows.zip

    - name: Upload Build Artifact (Actions Tab)
      uses: actions/upload-artifact@v4
      with:
        name: StreamChatOverlay-windows
        path: dist/StreamChatOverlay-windows.zip

    - name: Upload Release Asset
      if: github.event_name == 'release'
      uses: softprops/action-gh-release@v2
      with:
        files: dist/StreamChatOverlay-windows.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
