name: Build EXE

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
      - '*'
  release:
    types: [published, created, edited, prereleased]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Setup UPX
      uses: crazy-max/ghaction-upx@v3
      with:
        version: latest
        install-only: true

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install --force-reinstall --no-cache-dir -r requirements.txt

    - name: Verify key packages installed
      run: |
        python -c "import requests; print('requests OK:', requests.__version__)"
        python -c "import PySide6; print('PySide6 OK')"
        python -c "import pyttsx3; print('pyttsx3 OK')"
        python -c "import TikTokLive; print('TikTokLive OK')"

    - name: Build EXE with PyInstaller
      run: pyinstaller --clean --noconfirm StreamChatOverlay.spec

    - name: Normalize timestamps (semua file pakai waktu yang sama)
      run: |
        $buildTime = Get-Date
        Get-ChildItem -Path dist\StreamChatOverlay -Recurse | ForEach-Object {
          $_.LastWriteTime = $buildTime
          $_.CreationTime  = $buildTime
        }
        $exePath = "dist\StreamChatOverlay\StreamChatOverlay.exe"
        if (Test-Path $exePath) {
          (Get-Item $exePath).LastWriteTime = $buildTime
          (Get-Item $exePath).CreationTime  = $buildTime
        }
        Write-Output "Timestamps normalized to: $buildTime"

    - name: Zip output folder
      run: |
        Compress-Archive -Path dist\StreamChatOverlay -DestinationPath dist\StreamChatOverlay-windows.zip

    - name: Upload Build Artifact (Actions Tab)
      uses: actions/upload-artifact@v4
      with:
        name: StreamChatOverlay-windows
        path: dist/StreamChatOverlay-windows.zip

    - name: Upload Release Asset
      if: github.event_name == 'release'
      uses: softprops/action-gh-release@v2
      with:
        files: dist/StreamChatOverlay-windows.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
